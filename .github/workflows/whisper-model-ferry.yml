name: Temporary Whisper Model Ferry

on:
  push:
    paths:
      - '.github/workflows/whisper-model-ferry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download Whisper tiny English Q5 model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-tiny.en-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en-q5_1.bin
          test "$(stat -c%s ggml-tiny.en-q5_1.bin)" -gt 30000000
          sha256sum ggml-tiny.en-q5_1.bin

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-tiny-en-q5-model
          path: ggml-tiny.en-q5_1.bin
          retention-days: 1
          compression-level: 0
