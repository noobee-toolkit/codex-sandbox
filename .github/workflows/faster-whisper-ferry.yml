name: Temporary Faster Whisper Ferry

on:
  push:
    paths:
      - '.github/workflows/faster-whisper-ferry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Build portable Python 3.12 Faster Whisper runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.12
          PY="$(uv python find 3.12)"
          ROOT="$(dirname "$(dirname "$PY")")"
          mkdir -p bundle/runtime
          cp -a "$ROOT" bundle/runtime/python
          uv venv /tmp/fwenv --python 3.12
          uv pip install --python /tmp/fwenv/bin/python faster-whisper
          cp -a /tmp/fwenv/lib/python3.12/site-packages bundle/runtime/site-packages
          PYTHONPATH="$PWD/bundle/runtime/site-packages" bundle/runtime/python/bin/python3.12 - <<'PY'
          import faster_whisper, ctranslate2
          print('faster-whisper', faster_whisper.__version__)
          print('ctranslate2', ctranslate2.__version__)
          PY
          du -sh bundle/runtime/python bundle/runtime/site-packages

      - name: Download Faster Whisper base English model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/model
          PYTHONPATH="$PWD/bundle/runtime/site-packages" bundle/runtime/python/bin/python3.12 - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='Systran/faster-whisper-base.en', local_dir='bundle/model')
          PY
          du -sh bundle/model

      - name: Upload Python runtime
        uses: actions/upload-artifact@v4
        with:
          name: fw-python-312-runtime
          path: bundle/runtime/python
          retention-days: 1
          compression-level: 0

      - name: Upload site packages
        uses: actions/upload-artifact@v4
        with:
          name: fw-site-packages
          path: bundle/runtime/site-packages
          retention-days: 1
          compression-level: 0

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-base-en-model
          path: bundle/model
          retention-days: 1
          compression-level: 0
