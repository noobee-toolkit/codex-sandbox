name: Temporary Faster Whisper Ferry

on:
  push:
    paths:
      - '.github/workflows/faster-whisper-ferry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Build portable Python 3.12 Faster Whisper runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.12
          PY="$(uv python find 3.12)"
          ROOT="$(dirname "$(dirname "$PY")")"
          mkdir -p bundle
          cp -a "$ROOT" bundle/python
          uv pip install --python bundle/python/bin/python3.12 --system faster-whisper
          bundle/python/bin/python3.12 - <<'PY'
          import faster_whisper, ctranslate2
          print('faster-whisper', faster_whisper.__version__)
          print('ctranslate2', ctranslate2.__version__)
          PY

      - name: Download Faster Whisper base English model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/model
          bundle/python/bin/python3.12 - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='Systran/faster-whisper-base.en',
              local_dir='bundle/model',
          )
          PY
          du -sh bundle bundle/python bundle/model

      - name: Upload portable runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-portable-base-en
          path: bundle
          retention-days: 1
          compression-level: 0
